[package]
name = "use-xml"
version = "0.1.0"
edition = "2024"
authors = ["Radek Micek"]
license = "Zlib"
description = "Extract data from XML documents and check that nothing was left unused."
repository = "https://github.com/radekm/use-xml-rust"
autobenches = false

[dependencies]
quick-xml = "=0.42.0"
thiserror = "=2.0.21"
rust_decimal = { version = "=1.43.0", default-features = false }
time = { version = "=0.3.55", default-features = false }

[dev-dependencies]
# Features needed only by tests (`dec!`, `datetime!`, `format_description!`, and formatting).
rust_decimal = { version = "=1.43.0", default-features = false, features = ["macros"] }
time = { version = "=0.3.55", default-features = false, features = ["formatting", "macros"] }
anyhow = "=1.0.105"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "m7_message"
harness = false
